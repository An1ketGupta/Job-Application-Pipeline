services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: careerlift_test
      POSTGRES_PASSWORD: careerlift_test
      POSTGRES_DB: careerlift_test
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U careerlift_test -d careerlift_test']
      interval: 2s
      retries: 20
  redis-test:
    image: redis:7-alpine
    ports:
      - '56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      retries: 20
